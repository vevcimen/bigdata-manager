[mysql]
host     = db
port     = 3306
database = cluster_manager
user     = cm_user
password = cm_password

[prometheus]
url     = http://localhost:9090
timeout = 10

[ssh]
user     = cm_user
key_path = ~/.ssh/id_rsa
timeout  = 30

[metrics]
interval_seconds = 60

[mcli]
alias = pure

[general]
topology_file = /app/topology.yaml
log_level     = DEBUG
