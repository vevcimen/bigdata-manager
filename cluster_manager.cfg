[mysql]
host     = 127.0.0.1
port     = 3306
database = cluster_manager
user     = cm_user
password = cm_password

[prometheus]
url     = https://bd-prometheus.hmb.gov.tr
timeout = 10

[ssh]
user     = cm_user
key_path = ~/.ssh/id_rsa
timeout  = 30

[metrics]
# Otomatik metrik toplama aralığı (saniye)
interval_seconds = 60

[mcli]
# MinIO Client alias (Pure Storage için)
# mcli alias set pure https://pure-s3.hmb.gov.tr ACCESS_KEY SECRET_KEY
alias = pure

[general]
topology_file = topology.yaml
log_level     = INFO
